<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0058BE" />
    <meta
      name="description"
      content="HomeBuild — AI-powered home construction management platform. Blueprint, Understanding, Intelligence, Lifecycle, Design."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>HomeBuild — Construction Management</title>
    <script>
      /* Applies the saved theme before first paint so there is no flash of the
         wrong palette. Mirrors the logic in src/context/ThemeContext.jsx. */
      (function () {
        try {
          var stored = localStorage.getItem('homebuild.theme')
          var choice =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system'
          var dark =
            choice === 'dark' ||
            (choice === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var resolved = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = resolved
          document.documentElement.style.colorScheme = resolved
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
